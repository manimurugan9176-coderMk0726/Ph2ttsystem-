<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediTrack Pro - Clinical Health & Nursing Portal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css?v=7.0">
</head>
<body>

  <!-- Top Header with Roster Switcher & Add Staff Button -->
  <header>
    <div class="logo">
      <i class="fa-solid fa-heart-pulse"></i>
      <div>Medi<span>Track</span> Pro</div>
    </div>

    <div class="duty-switcher">
      <div class="selector-group">
        <label><i class="fa-solid fa-user-doctor"></i> Doctor:</label>
        <select id="activeDoctor" onchange="handleDutyChange()"></select>
      </div>

      <div class="selector-group">
        <label><i class="fa-solid fa-user-nurse"></i> Nurse:</label>
        <select id="activeNurse" onchange="handleDutyChange()"></select>
      </div>

      <!-- Add New Doctor / Nurse Modal Trigger -->
      <button type="button" class="btn-add-staff" onclick="openStaffModal()">
        <i class="fa-solid fa-user-plus"></i> + Add Staff
      </button>

      <div class="duty-mode-toggle">
        <button type="button" class="duty-btn active" id="btnRoleDoctor" onclick="switchRoleView('Doctor')">
          <i class="fa-solid fa-stethoscope"></i> Doctor View
        </button>
        <button type="button" class="duty-btn" id="btnRoleNurse" onclick="switchRoleView('Nurse')">
          <i class="fa-solid fa-hand-holding-medical"></i> Nurse View
        </button>
      </div>
    </div>
  </header>

  <!-- Live Urgent Clinical Alert Bar -->
  <div class="alert-bar" id="alertBar">
    <div class="alert-content">
      <i class="fa-solid fa-bell alert-bell"></i>
      <span id="alertMessage">Monitoring Vitals in Real-Time...</span>
    </div>
    <button class="alert-refresh-btn" onclick="checkClinicalAlerts()" title="Sync Vitals Now">
      <i class="fa-solid fa-arrows-rotate"></i> Sync Alerts
    </button>
  </div>

  <!-- Main System App -->
  <main class="container">
    <div class="stats-container">
      <div class="stat-card">
        <i class="fa-solid fa-hospital-user stat-icon"></i>
        <div><h3 id="cTotal">0</h3><p>Total Patients</p></div>
      </div>
      <div class="stat-card yellow">
        <i class="fa-solid fa-bed-pulse stat-icon"></i>
        <div><h3 id="cActive">0</h3><p>Under Treatment</p></div>
      </div>
      <div class="stat-card red">
        <i class="fa-solid fa-triangle-exclamation stat-icon"></i>
        <div><h3 id="cCritical">0</h3><p>Critical Priority</p></div>
      </div>
      <div class="stat-card green">
        <i class="fa-solid fa-house-chimney-medical stat-icon"></i>
        <div><h3 id="cDischarged">0</h3><p>Discharged</p></div>
      </div>
    </div>

    <div class="grid-layout">
      <!-- Left: Patient Admission Form -->
      <div class="card">
        <h2><i class="fa-solid fa-file-waveform"></i> Patient Admission & Care Entry</h2>
        <form onsubmit="createPatient(event)">
          <div class="form-group">
            <label>Patient Full Name *</label>
            <input type="text" id="name" required placeholder="e.g. Ramesh Kumar">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Age *</label>
              <input type="number" id="age" required placeholder="Years">
            </div>
            <div class="form-group">
              <label>Gender</label>
              <select id="gender">
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Blood Group</label>
              <select id="blood">
                <option value="O+">O+</option>
                <option value="O-">O-</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
              </select>
            </div>
            <div class="form-group">
              <label>Emergency Contact *</label>
              <input type="tel" id="phone" required placeholder="Mobile Number">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Ward / Bed Allocation *</label>
              <input type="text" id="bed" required placeholder="e.g. ICU-02 or Ward 3 - Bed 08">
            </div>
            <div class="form-group">
              <label>Assigned Care Nurse *</label>
              <select id="pAssignedNurse"></select>
            </div>
          </div>

          <!-- Clinical Vitals -->
          <div class="form-row">
            <div class="form-group">
              <label>BP (mmHg)</label>
              <input type="text" id="vBp" placeholder="120/80">
            </div>
            <div class="form-group">
              <label>Pulse (bpm)</label>
              <input type="number" id="vPulse" placeholder="78">
            </div>
            <div class="form-group">
              <label>SpO2 (%)</label>
              <input type="number" id="vSpo2" placeholder="98">
            </div>
          </div>

          <div class="form-group">
            <label>Diagnosis / Clinical Complaint *</label>
            <input type="text" id="diagnosis" required placeholder="e.g. Chronic Asthma, Diabetes">
          </div>

          <div class="form-group">
            <label>Prescribed Medication & Doctor Orders *</label>
            <textarea id="treatment" required placeholder="Dosage, IV fluids, and nursing care instructions..."></textarea>
          </div>

          <div class="form-group">
            <label>Admission Status</label>
            <select id="status">
              <option value="Ongoing">Under Treatment (Ongoing)</option>
              <option value="Critical">Critical Priority</option>
              <option value="Recovered">Recovered / Normal</option>
            </select>
          </div>

          <div class="form-group">
            <label>Next Doctor Round Date</label>
            <input type="date" id="date">
          </div>

          <button type="submit" class="btn-submit"><i class="fa-solid fa-circle-plus"></i> Save Patient File</button>
        </form>
      </div>

      <!-- Right: Live Patient Roster -->
      <div class="card">
        <div class="roster-header">
          <h2><i class="fa-solid fa-clipboard-list"></i> Clinical Records & Nursing Tracker</h2>
          <div class="nurse-filter-tab">
            <button type="button" class="filter-pill active" id="filterAll" onclick="filterByNurse('all')">All Patients</button>
            <button type="button" class="filter-pill" id="filterMine" onclick="filterByNurse('mine')">My Ward Patients Only</button>
          </div>
        </div>

        <div class="form-group">
          <input type="text" id="search" placeholder="🔍 Search patient, bed, diagnosis, doctor or nurse..." oninput="filterData()">
        </div>

        <div id="patientList" class="patient-grid"></div>
      </div>
    </div>
  </main>

  <!-- Modal Popup: Add New Clinical Staff -->
  <div class="modal-overlay" id="staffModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3><i class="fa-solid fa-user-doctor"></i> Add Doctor / Nurse to Hospital</h3>
        <button type="button" class="btn-close" onclick="closeStaffModal()"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form onsubmit="saveNewStaff(event)">
        <div class="form-group">
          <label>Staff Role *</label>
          <select id="newRole" required>
            <option value="Doctor">Doctor (Specialist / Consultant)</option>
            <option value="Nurse">Nurse (Clinical / Ward Duty)</option>
          </select>
        </div>

        <div class="form-group">
          <label>Full Name *</label>
          <input type="text" id="newName" required placeholder="e.g. Dr. K. Vignesh or Nurse Rekha">
        </div>

        <div class="form-group">
          <label>Specialty / Department / Ward *</label>
          <input type="text" id="newSpecialty" required placeholder="e.g. Neurology, ICU, Emergency">
        </div>

        <button type="submit" class="btn-submit" style="margin-top: 15px;">
          <i class="fa-solid fa-check-circle"></i> Add Staff to Roster
        </button>
      </form>
    </div>
  </div>

  <footer>
    <p>🩺 MediTrack Pro - Clinical Health and Treatment Tracking System</p>
  </footer>

  <script src="script.js?v=7.0"></script>
</body>
</html>
